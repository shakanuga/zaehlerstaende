name: Updates prüfen & mergen

# Läuft bei jedem Pull Request von Dependabot (Paket-, Basis-Image- und Actions-Updates).
#   1. prüfen: Docker-Image bauen, Tests im Image, Container starten
#   2. mergen: ist alles grün, wird der PR automatisch gemergt (squash) und danach das Docker-Image neu veröffentlicht.
# Klappt etwas nicht, bleibt der PR offen und es gibt EIN Issue "⚠️ Automatische Updates
# brauchen dich" (dir zugewiesen → genau dann kommt eine Mail). Weitere Probleme landen als
# Kommentar im selben Issue. Wenn alles erledigt ist: Issue schließen.
#
# Optional: Fine-grained Token als *Dependabot*-Secret AUTOMERGE_TOKEN
# (Rechte für dieses Repo: Contents, Pull requests, Workflows – je "Read and write").
# Nur damit lassen sich auch Updates mergen, die Dateien unter .github/workflows/
# ändern (Updates der GitHub Actions selbst) – das normale Actions-Token darf das nicht.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: auto-updates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # "false" = große Versionssprünge (major) bleiben zum Anschauen liegen
  MAJOR_AUTOMERGE: "true"

jobs:
  pruefen:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Docker-Image bauen
        run: docker build --pull -t pr-image:test .

      - name: Tests im gebauten Image (gleiches Python, gleiche Pakete, gleiche Systemprogramme)
        run: |
          docker run --rm -u 0 -e HOME=/tmp -v "$PWD:/src" -w /src --entrypoint sh pr-image:test \
            -c 'pip install -q pytest && python -m pytest -q tests'

      - name: Starttest – Container muss hochkommen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # Startet ein Image und wartet, bis der Healthcheck "healthy" meldet
          # (ohne Healthcheck: läuft er nach 20 s noch?).
          starten() {
            local img="$1" args=() cid status
            if [ -n "$(docker image inspect -f '{{if .Config.Healthcheck}}ja{{end}}' "$img")" ]; then
              args=(--health-interval=3s --health-timeout=5s --health-retries=20 --health-start-period=0s)
            fi
            cid=$(docker run -d "${args[@]}" "$img")
            if [ ${#args[@]} -eq 0 ]; then
              sleep 20
              status=$(docker inspect -f '{{.State.Status}}' "$cid")
            else
              for _ in $(seq 1 40); do
                status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
                case "$status" in healthy|unhealthy|exited|dead) break ;; esac
                sleep 3
              done
            fi
            echo "--- $img: $status"
            docker logs "$cid" 2>&1 | tail -n 40
            docker rm -f "$cid" >/dev/null
            [ "$status" = healthy ] || [ "$status" = running ]
          }

          if starten pr-image:test; then
            echo "✅ Container mit dem Update läuft."
            exit 0
          fi

          # Kommt er nicht hoch, mit dem Stand vor dem Update vergleichen: Fehlt im
          # Test nur eine Einstellung (z. B. Login), geht es vorher auch nicht – dann
          # ist das kein Rückschritt durch das Update.
          echo "Container mit dem Update kommt nicht hoch – Gegenprobe mit dem alten Stand …"
          git fetch -q --depth 1 origin "$BASE_SHA"
          git worktree add -q --detach /tmp/basis FETCH_HEAD
          docker build -q -t basis-image:test /tmp/basis
          if starten basis-image:test; then
            echo "::error::Vorher lief der Container, mit dem Update nicht mehr."
            exit 1
          fi
          echo "::warning::Auch ohne Update kommt der Container im Test nicht hoch – kein Rückschritt durch das Update."

  mergen:
    needs: pruefen
    runs-on: ubuntu-latest
    outputs:
      liegen_lassen: ${{ steps.gate.outputs.ok == 'false' }}
    env:
      HAS_PAT: ${{ secrets.AUTOMERGE_TOKEN != '' }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      - name: Große Versionssprünge ggf. liegen lassen
        id: gate
        env:
          TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          if [ "$TYPE" = "version-update:semver-major" ] && [ "$MAJOR_AUTOMERGE" != "true" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mergen
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f merge_method=squash -f sha="$SHA"; then
            GH_TOKEN="$ACTIONS_TOKEN" gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Alle Prüfungen sind grün, aber automatisch mergen ging nicht. Meist liegt das daran, dass der PR Dateien unter \`.github/workflows/\` ändert – das darf nur ein Token mit Workflow-Recht (Dependabot-Secret \`AUTOMERGE_TOKEN\`, siehe Kommentar oben in .github/workflows/auto-updates.yml). Bitte einmal von Hand mergen."
            exit 1
          fi

      # Ein Merge mit dem Actions-Token löst keinen Push-Workflow aus, ein
      # workflow_dispatch schon – deshalb wird das Image hier direkt neu gebaut.
      # (Mit AUTOMERGE_TOKEN passiert das über den normalen Push.)
      - name: Image neu veröffentlichen
        if: steps.gate.outputs.ok == 'true' && env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run docker.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.pull_request.base.ref }}"
          # Build abwarten – schlägt er fehl, wird das unten als Problem gemeldet
          sleep 15
          id=$(gh run list -R "$GITHUB_REPOSITORY" -w docker.yml -e workflow_dispatch -L 1 --json databaseId --jq '.[0].databaseId')
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null

  # Meldet sich nur, wenn etwas nicht automatisch geklappt hat.
  melden:
    needs: [pruefen, mergen]
    if: >-
      always() && (needs.pruefen.result == 'failure' || needs.mergen.result == 'failure'
      || needs.mergen.outputs.liegen_lassen == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Problem im Sammel-Issue melden
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITEL: ${{ github.event.pull_request.title }}
          LOG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GRUND: >-
            ${{ needs.mergen.outputs.liegen_lassen == 'true' && 'großer Versionssprung – bitte anschauen und selbst mergen'
            || needs.pruefen.result == 'failure' && 'Prüfung fehlgeschlagen (Tests, Build oder Starttest)'
            || 'Mergen oder Image-Neubau hat nicht geklappt' }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          TITEL="⚠️ Automatische Updates brauchen dich"
          ZEILE="- [ ] #$PR – $PR_TITEL: **$GRUND** ([Log]($LOG))"
          nr=$(gh api "repos/$R/issues?state=open&per_page=100" | jq -r --arg t "$TITEL" '[.[] | select(.title == $t and (.pull_request | not))][0].number // empty')
          if [ -z "$nr" ]; then
            body=$(printf 'Hier landet nur, was bei den automatischen Updates **nicht** von selbst geklappt hat.\nWenn alles erledigt ist, das Issue einfach schließen.\n\n%s\n' "$ZEILE")
            gh api "repos/$R/issues" -f title="$TITEL" -f body="$body" -f "assignees[]=$GITHUB_REPOSITORY_OWNER" > /dev/null
            echo "Neues Issue angelegt."
          else
            # Gleichen PR nicht mehrfach melden (z. B. nach jedem Rebase)
            bekannt=$( { gh api "repos/$R/issues/$nr" --jq .body; gh api "repos/$R/issues/$nr/comments?per_page=100" --jq '.[].body'; } )
            if grep -qF "#$PR –" <<<"$bekannt"; then
              echo "PR #$PR steht schon in Issue #$nr."
            else
              gh api "repos/$R/issues/$nr/comments" -f body="$ZEILE" > /dev/null
              echo "In Issue #$nr ergänzt."
            fi
          fi
